name: Keep Supabase Awake

# Supabase sospende i progetti gratuiti dopo ~7 giorni di inattività.
# Questo workflow interroga entrambi i progetti (produzione e sviluppo) ogni
# 12 ore, così restano attivi.
#
# Secrets richiesti (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF       ref del progetto di produzione (la parte prima
#                              di .supabase.co nell'URL del progetto)
#   SUPABASE_ANON_KEY          anon/public key di produzione
#   SUPABASE_DEV_PROJECT_REF   ref del progetto di sviluppo   (opzionale)
#   SUPABASE_DEV_ANON_KEY      anon/public key di sviluppo    (opzionale)
#
# Se i secrets di sviluppo non sono impostati, quel ping viene saltato con un
# warning invece di far fallire il workflow.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (produzione)
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::Secrets di produzione mancanti (SUPABASE_PROJECT_REF / SUPABASE_ANON_KEY)."
            exit 1
          fi
          curl -fsS -o /dev/null -H "apikey: $ANON_KEY" \
               "https://$PROJECT_REF.supabase.co/rest/v1/"
          echo "Produzione ($PROJECT_REF): sveglia."

      # always() così un fallimento della produzione non salta il ping di dev.
      - name: Ping Supabase (sviluppo)
        if: always()
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$ANON_KEY" ]; then
            echo "::warning::Secrets di sviluppo non configurati: ping saltato."
            exit 0
          fi
          curl -fsS -o /dev/null -H "apikey: $ANON_KEY" \
               "https://$PROJECT_REF.supabase.co/rest/v1/"
          echo "Sviluppo ($PROJECT_REF): sveglio."
