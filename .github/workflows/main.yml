name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/
